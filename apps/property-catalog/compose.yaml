services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_LOCAL_PREVIEW: "1"
      DATABASE_URL: postgres://buildry:buildry_dev_only@postgres:5432/buildry
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/login"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
  postgres:
    image: postgres:17-alpine
    container_name: buildry-property-postgres
    environment:
      POSTGRES_DB: buildry
      POSTGRES_USER: buildry
      POSTGRES_PASSWORD: buildry_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - property_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildry -d buildry"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  property_postgres_data:
