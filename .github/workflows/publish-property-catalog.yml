name: Publish property catalog route

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0efa3055e899dfc244b216554a334cf2
      CLOUDFLARE_TUNNEL_ID: 7ade6a2a-8f5d-442b-80b1-c1c9618a6e82
    steps:
      - name: Update the existing tunnel route
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + os.environ["CLOUDFLARE_ACCOUNT_ID"]
              + "/cfd_tunnel/"
              + os.environ["CLOUDFLARE_TUNNEL_ID"]
              + "/configurations"
          )
          headers = {
              "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
              "Content-Type": "application/json",
          }

          def call(method, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = Request(base, headers=headers, data=body, method=method)
              with urlopen(request, timeout=30) as response:
                  data = json.load(response)
              if not data.get("success"):
                  raise RuntimeError("Cloudflare rejected the tunnel configuration")
              return data["result"]

          config = call("GET")["config"]
          matches = [
              rule for rule in config["ingress"]
              if rule.get("hostname") == "app.buildry.ca"
          ]
          if len(matches) != 1:
              raise RuntimeError("Expected exactly one app.buildry.ca ingress rule")

          rule = matches[0]
          expected = "http://hello.hello.svc.cluster.local:80"
          target = "http://127.0.0.1:8080"
          if rule["service"] not in (expected, target):
              raise RuntimeError("The ingress service changed unexpectedly")
          if rule["service"] != target:
              rule["service"] = target
              call("PUT", {"config": config})

          updated = call("GET")["config"]
          if not any(
              item.get("hostname") == "app.buildry.ca"
              and item.get("service") == target
              for item in updated["ingress"]
          ):
              raise RuntimeError("The updated route could not be verified")
          print("app.buildry.ca now routes to the property catalog service")
          PY
